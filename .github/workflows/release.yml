name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/airquality/manifest.json'))['version'])")
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "ERROR: manifest.json version ($manifest_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Verify release notes file exists
        run: |
          notes_path="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_path" ]; then
            echo "ERROR: release notes not found at $notes_path"
            echo "Create the file before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "docs/release-notes/${{ github.ref_name }}.md"
          name: "${{ github.ref_name }}"
