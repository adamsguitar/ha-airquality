<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Air Quality UI{% endblock %}</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Air Quality</h1>
      <nav>
        <a href="./">Overview</a>
        <a href="discover">Discover</a>
        <a href="edit">Edit YAML</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      <small>YAML source: <code>{{ yaml_path | default('/config/airquality.yaml') }}</code></small>
    </footer>
  </body>
</html>
