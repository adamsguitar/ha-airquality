<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Air Quality{% endblock %}</title>
    <link rel="stylesheet" href="static/style.css">
  </head>
  <body>
    <header class="topbar">
      <h1>Air Quality</h1>
      <nav>
        <a href="./">Rooms</a>
        <a href="discover">Discover</a>
        <a href="profiles">Threshold profiles</a>
      </nav>
    </header>
    <main>
      {% if integration_error %}
        <div class="banner error">{{ integration_error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer>
      <small>Configuration is stored in <code>{{ yaml_path | default('/config/airquality.yaml') }}</code>. You can edit that file directly if you prefer.</small>
    </footer>
  </body>
</html>
